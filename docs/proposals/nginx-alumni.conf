# PROPOSTA DE REFERÊNCIA; NÃO INSTALAR SEM INSPECCIONAR nginx -T.
# Inserir dentro de cada server {} que possa servir o mesmo public/storage,
# incluindo hosts alternativos. Rever aliases/CDN e regras já existentes.
# Estas locations afectam apenas URLs directos, não o download autenticado
# /portal/documentos/{documento}/download tratado pelo Laravel.

location = /storage/alumni-documentos {
    add_header Cache-Control "no-store" always;
    return 404;
}

location ^~ /storage/alumni-documentos/ {
    add_header Cache-Control "no-store" always;
    return 404;
}

# Não substituir a location /storage/ existente: imagens, notícias, editais
# e outros documentos públicos continuam a depender dessa árvore.
