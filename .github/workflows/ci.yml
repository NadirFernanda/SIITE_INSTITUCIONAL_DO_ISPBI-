name: CI

"on":
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, intl, xml

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}

      - name: Install Composer dependencies
        run: composer install --no-progress --no-suggest --prefer-dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build --if-present

      - name: Generate app key
        run: php artisan key:generate --ansi || true

      - name: Run tests
        run: |
          if [ -x vendor/bin/pest ]; then
            vendor/bin/pest --colors=always
          elif [ -x vendor/bin/phpunit ]; then
            vendor/bin/phpunit --colors=always
          else
            echo "No test runner found; skipping tests"
          fi

  lighthouse:
    name: Lighthouse (accessibility)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Lighthouse
        run: npm install -g lighthouse@10

      - name: Run Lighthouse categories
        if: vars.SITE_URL != ''
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          echo "Running Lighthouse against $SITE_URL"
          lighthouse "$SITE_URL" --only-categories=accessibility,performance,seo,best-practices --chrome-flags="--headless" --output=json --output-path=./lighthouse_report.json || true

      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse_report.json
